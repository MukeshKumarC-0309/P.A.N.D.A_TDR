name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The unit tests exercise the pure detection/report/guard logic, which
      # imports only the standard library — no Splunk, LLM, or API keys needed.
      # (The full live pipeline needs external services and isn't unit-tested here.)
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run unit tests
        run: pytest tests/ -q
